  toast('⏳ Comprimiendo…');let files=collect(nodes,'',[]);
  if(v.h==='no')files=files.filter(f=>!f.p.split('/').some(s=>s.startsWith('.')));
  const orig=files.reduce((a,f)=>a+(f.b?f.b.size:0),0);let blob,ex;
  if(v.f==='zip'){blob=await mkZip(files,+v.l);ex='.zip'}else{const t=await mkTar(files);if(v.f==='tar'){blob=t;ex='.tar'}else{blob=await new Response(t.stream().pipeThrough(new CompressionStream('gzip'))).blob();ex='.tar.gz'}}
  const name=uniq(cur(),(v.n.trim()||'archivo').replace(/\//g,'_')+ex);cur().c.push({n:name,d:false,b:blob});
  if(v.a==='d')for(const x of nodes){const i=cur().c.indexOf(x);if(i>=0){if(x.real)await fsDel(x);cur().c.splice(i,1)}}
  sel.clear();await save();close();render();if(v.s==='y')dl(blob,name);
  toast(`✅ ${name} · ${fmt(blob.size)}`+(orig?` · ahorro ${Math.max(0,Math.round(100-blob.size*100/orig))}%`:''))})}
async function extract(x,folder,show){
 try{toast('⏳ Extrayendo…');const files=await readArc(x);let dir=cur();
  if(folder){const nd={n:uniq(dir,x.n.replace(/\.(tar\.gz|tgz|zip|tar)$/i,'')),d:true,c:[]};dir.c.push(nd);dir=nd}
  files.forEach(f=>addPath(dir,f.p,f.b));sel.clear();await save();render();const cnt=files.filter(f=>!f.dir).length;toast(`📦 ${cnt} archivos extraídos`);if(show)afterExtract(x,folder?dir:null,cnt)}catch(e){toast('⚠️ '+e.message)}}
function afterExtract(x,nd,cnt){
 const o=[];
 if(nd)o.push(['📂 Abrir carpeta «'+nd.n+'»',()=>{stack.push(nd);render()}],['🗜️ Volver a comprimir «'+nd.n+'»',()=>compress([nd])]);
 else o.push(['🗜️ Comprimir todo lo de esta carpeta',()=>compress(cur().c.slice())]);
 o.push(['🗑️ Borrar el comprimido original',()=>remove([x])],['⬇️ Descargar «'+x.n+'»',()=>dl(x.b,x.n)],['👍 Listo',()=>{}]);
 sheet('✅ '+cnt+' archivos extraídos',o)}
async function view(x){
 try{const f=await readArc(x);open(`<h3>📂 ${esc(x.n)}</h3>`+f.map(e=>`<div class="li"><span>${e.dir?'📁 ':''}${esc(e.p)}</span><span>${e.dir?'':fmt(e.b.size)}</span></div>`).join('')+'<div class="acts" style="margin-top:12px"><button class="bt" onclick="close()">Cerrar</button></div>','mid');$('box').onclick=null}catch(e){toast('⚠️ '+e.message)}}
function rename(x){ask('🏷️ Renombrar',[{id:'n',l:'Nuevo nombre',v:x.n}],'Guardar',async v=>{const n=v.n.trim().replace(/\//g,'_');if(!n)return;if(n!==x.n&&cur().c.some(y=>y.n===n))throw new Error('Ya existe ese nombre');if(x.real){if(cur().dev)throw new Error('Esa carpeta no se puede renombrar');const np=(cur().path?cur().path+'/':'')+n;if(n!==x.n){await FS().rename({from:x.path,to:np,directory:D,toDirectory:D});x.path=np;if(x.d){x.c=[];x.loaded=false}}}x.n=n;sel.clear();await save();close();render()})}
function remove(nodes){ask('🗑️ Eliminar',[{id:'x',l:`¿Eliminar ${nodes.length} elemento(s)? No se puede deshacer.`,o:[['y','Sí, eliminar']]}],'Eliminar',async()=>{for(const x of nodes)if(x.real)await fsDel(x);cur().c=cur().c.filter(x=>!nodes.includes(x));sel.clear();await save();close();render();toast('🗑️ Eliminado')})}
function edit(x){x.b.text().then(t=>ask('📝 '+esc(x.n),[{id:'t',l:'Contenido',ta:1,v:t}],'Guardar',async v=>{x.b=new Blob([v.t],{type:'text/plain'});if(x.real)await wr(x.path,x.b);await save();close();render();toast('💾 Guardado')}))}
async function openItem(x){
 if(x.d){if(x.real&&!(await ensurePerm()))return;if(x.real&&!x.dev&&!(await loadDir(x)))return;stack.push(x);$('q').value='';render();return}
 if(isArc(x.n))return sheet(x.n,[['📂 Ver contenido',()=>view(x)],['📦 Extraer aquí',()=>extract(x,false,1)],['📁 Extraer en «'+x.n.replace(/\.(tar\.gz|tgz|zip|tar)$/i,'')+'»',()=>extract(x,true,1)],['⬇️ Descargar',()=>dl(x.b,x.n)]]);
 if(isTxt(x))return sheet(x.n,[['📝 Editar',()=>edit(x)],['⬇️ Descargar',()=>dl(x.b,x.n)],['🗜️ Comprimir',()=>compress([x])]]);
 sheet(x.n,[['⬇️ Descargar',()=>dl(x.b,x.n)],['🗜️ Comprimir',()=>compress([x])]])}
/* ---- interfaz ---- */
function render(){
 const d=cur(),n=sel.size;document.body.classList.toggle('sel',n>0);
 $('hd').innerHTML=n?`<div class="row1"><button class="ib" id="x">✕</button><div class="logo">${n} seleccionado(s)</div><button class="ib" id="all">☑️</button></div>`
 :`<div class="row1"><div class="logo">OmniFile <i>ZA</i> 圧縮</div>${d.real&&!d.dev?'<button class="ib" id="rf">🔄</button>':''}<button class="ib" id="sq">🔍</button><button class="ib" id="so">${['🔤','📏'][sortM]}</button></div><div id="crumb">${stack.map((s,i)=>`<button data-i="${i}">${i?esc(s.n):'📱 ストレージ'}</button>`).join('')}</div><input id="q" placeholder="Buscar en esta carpeta…" value="${esc($('q')?$('q').value:'')}" style="display:${showQ?'block':'none'}">`;
 const q=($('q')?$('q').value:'').toLowerCase();
 const items=d.c.filter(x=>x.n.toLowerCase().includes(q)).sort((a,b)=>b.d-a.d||(sortM?size(b)-size(a):a.n.localeCompare(b.n)));
 $('list').innerHTML=items.length?items.map(x=>`<div class="row${sel.has(x)?' s':''}" data-i="${d.c.indexOf(x)}"><div class="ic ${cls(x)}">${icon(x)}</div><div class="nm"><b>${esc(x.n)}</b><small>${x.d?x.c.length+' elementos':fmt(x.b.size)}</small></div><div class="ck">✓</div></div>`).join(''):`<div class="empty"><big>${q?'🔍':'🌸'}</big>${q?'Sin resultados':'Carpeta vacía<br>Toca ⚡ para crear o cargar archivos'}</div>`;
 const one=n===1?[...sel][0]:null,arcs=[...sel].every(x=>!x.d&&isArc(x.n));
 $('sb').innerHTML=`<button data-a="zip"><span>🗜️</span>Comprimir</button>${n&&arcs?'<button data-a="ex"><span>📦</span>Extraer</button>':''}${one&&!one.d?'<button data-a="dl"><span>⬇️</span>Bajar</button>':''}${one?'<button data-a="rn"><span>🏷️</span>Renombrar</button>':''}<button data-a="rm"><span>🗑️</span>Eliminar</button>`;
 const H=$('hd');if($('x'))$('x').onclick=()=>{sel.clear();render()};if($('all'))$('all').onclick=()=>{cur().c.forEach(x=>sel.add(x));render()};
 if($('rf'))$('rf').onclick=async()=>{if(await loadDir(cur())){render();toast('🔄 Actualizado')}};if($('sq'))$('sq').onclick=()=>{showQ=!showQ;render();if(showQ)$('q').focus()};if($('so'))$('so').onclick=()=>{sortM=1-sortM;render();toast(sortM?'Orden: tamaño':'Orden: nombre')};
 if($('q'))$('q').oninput=()=>{const v=$('q').value;render();$('q').focus();$('q').setSelectionRange(v.length,v.length)};
 $('crumb')&&($('crumb').onclick=e=>{const b=e.target.closest('button');if(b){stack=stack.slice(0,+b.dataset.i+1);sel.clear();render()}});
 const cr=$('crumb');if(cr)cr.scrollLeft=cr.scrollWidth}
let lp,lf=false;const L=$('list');
L.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r)return;lf=false;lp=setTimeout(()=>{lf=true;const x=cur().c[+r.dataset.i];sel.has(x)?sel.delete(x):sel.add(x);navigator.vibrate&&navigator.vibrate(25);render()},450)});
['pointerup','pointermove','pointercancel'].forEach(t=>L.addEventListener(t,()=>clearTimeout(lp)));
L.addEventListener('contextmenu',e=>e.preventDefault());
L.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;if(lf){lf=false;return}const x=cur().c[+r.dataset.i];if(sel.size){sel.has(x)?sel.delete(x):sel.add(x);render()}else openItem(x)});
$('sb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const ns=[...sel],a=b.dataset.a;
 if(a==='zip')compress(ns);if(a==='rm')remove(ns);if(a==='rn')rename(ns[0]);if(a==='dl'){dl(ns[0].b,ns[0].n)}
 if(a==='ex')(async()=>{for(const x of ns)await extract(x,true)})()};
$('fab').onclick=()=>sheet('Nuevo',[['📁 Nueva carpeta',()=>ask('📁 Nueva carpeta',[{id:'n',l:'Nombre',v:''}],'Crear',async v=>{const n=v.n.trim().replace(/\//g,'_');if(!n)return;cur().c.push({n:uniq(cur(),n),d:true,c:[]});await save();close();render()})],
 ['📝 Nuevo archivo de texto',()=>ask('📝 Nuevo archivo',[{id:'n',l:'Nombre con extensión',v:'nota.txt'},{id:'t',l:'Contenido',ta:1}],'Guardar',async v=>{const n=v.n.trim().replace(/\//g,'_');if(!n)return;cur().c.push({n:uniq(cur(),n),d:false,b:new Blob([v.t],{type:'text/plain'})});await save();close();render()})],
 ['📥 Cargar archivos del dispositivo',()=>$('fi').click()],
 ['📂 Cargar una carpeta completa',()=>$('fd').click()],
 ['🗜️ Comprimir TODO el almacenamiento',()=>root.c.filter(x=>!x.dev).length?compress(root.c.filter(x=>!x.dev)):toast('No hay nada que comprimir')],
 [`🗜️ Comprimir toda esta carpeta`,()=>cur().c.length?compress(cur().c.slice()):toast('La carpeta está vacía')]]);
$('fd').onchange=async e=>{let n=0;for(const f of e.target.files){addPath(cur(),f.webkitRelativePath||f.name,f);n++}e.target.value='';await save();render();toast('📂 '+n+' archivos cargados con sus carpetas')};
$('fi').onchange=async e=>{for(const f of e.target.files)cur().c.push({n:uniq(cur(),f.name),d:false,b:f});e.target.value='';await save();render();toast('📥 Archivos cargados')};
addEventListener('popstate',()=>{if(sel.size){sel.clear();render();history.pushState({},'')}else if(stack.length>1){stack.pop();render();history.pushState({},'')}});
history.pushState({},'');
(function(){const i=$('intro');for(let k=0;k<26;k++){const p=document.createElement('span'),z=7+Math.random()*9;p.className='pt';p.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;--dx:${Math.random()*40-20}vw;animation-duration:${4+Math.random()*4}s;animation-delay:${-Math.random()*6}s`;i.appendChild(p)}
const end=()=>{i.classList.add('out');setTimeout(()=>i.remove(),900)};setTimeout(end,3600);i.onclick=end})();
(async()=>{const r=await load();if(r&&r.c){root=r;stack=[root]}if(NAT){setupDev();root.c.unshift(dev)}render();if(typeof CompressionStream==='undefined')toast('⚠️ Tu navegador no soporta compresión nativa')})();
</script></body></html>
